name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ffmpeg-static / ffprobe-static download a single binary matching the
      # install host's arch. Force the target arch so a cross-arch build (e.g.
      # x64 on an arm64 macOS runner) bundles the *correct* ffmpeg binary.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build
        run: npm run build

      - name: Package (${{ matrix.platform }} ${{ matrix.arch }})
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          # No signing certificates in CI — build unsigned rather than fail
          # trying to auto-discover an identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Full history + tags so we can build a changelog since the last release.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv -f {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          # Hash every distributable except the checksum file itself.
          files=$(find . -maxdepth 1 -type f ! -name checksums.txt -printf '%P\n' | sort)
          sha256sum $files > checksums.txt
          cat checksums.txt

      - name: Build release notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          {
            echo "## 📦 Artifacts"
            echo ""
            echo "| File | SHA-256 |"
            echo "| ---- | ------- |"
            while read -r sha file; do
              echo "| \`${file}\` | \`${sha}\` |"
            done < release/checksums.txt
            echo ""
            echo "## 📝 Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
            else
              echo "Initial release."
              echo ""
              git log --no-merges --pretty=format:'- %s (%h)' "${CURRENT_TAG}"
            fi
            echo ""
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md
          # Also surface the notes on the workflow run summary page.
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
          # Appends GitHub's auto "What's Changed" (PRs, new contributors) below our notes.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-homebrew:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    # Skip prereleases — the cask should track stable versions only.
    if: ${{ !contains(github.ref, '-') }}

    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Dispatch cask update to tap
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: tool3/homebrew-tap
          event-type: update-cask
          client-payload: |
            {
              "cask": "fefe",
              "version": "${{ steps.version.outputs.version }}",
              "repo": "${{ github.repository }}"
            }
